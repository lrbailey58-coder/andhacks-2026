<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Let's design a board game</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>document.documentElement.className = 'js';</script>
</head>
<body data-session="{{ session_id }}">
  {# The feed begins centered vertically and horizontally, then scrolls. #}
  <main class="page" data-page>
    <img src="static/img/Render.png" style="position:absolute;height:100vh;align-self: center;"/>
    <div style="width:100%;height:100%;position:absolute;">
      <div class="feed" data-feed>
        <div class="feed__inner" data-feed-inner>
          {% for entry in entries %}{{ feed.entry(entry) }}{% endfor %}
        </div>
      </div>
    </div>
    <img src="static/img/name_black.png" alt="BGENT" style="position:fixed; bottom: 0%; left: 0%; width: 5em;"></img>
  </main>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
