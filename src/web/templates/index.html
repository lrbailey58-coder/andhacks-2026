<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Let's design a board game</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>document.documentElement.className = 'js';</script>
</head>
<body data-session="{{ session_id }}">
  {# The feed begins centered vertically and horizontally, then scrolls. #}
  <main class="page" data-page>
    <div class="feed" data-feed>
      <div class="feed__inner" data-feed-inner>
        {% for entry in entries %}{{ feed.entry(entry) }}{% endfor %}
      </div>
    </div>
  </main>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
