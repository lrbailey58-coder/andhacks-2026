[project]
name = "andhacks2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lrbailey", email = "lrbailey@wm.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.25.0",
    "python-dotenv>=1.2.3",
    "flask>=3.1.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["web/tests"]
pythonpath = ["web"]
addopts = "-q"

[project.scripts]
andhacks2026 = "andhacks2026:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
